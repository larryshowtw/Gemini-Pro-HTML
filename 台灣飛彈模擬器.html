<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣飛彈戰術模擬器</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
            background-color: #050505;
        }
        
        .font-tech {
            font-family: 'Orbitron', sans-serif;
        }
        
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            z-index: 1;
            background-color: #050505;
        }
        
        /* Tactical Glassmorphism */
        .glass-panel {
            background: rgba(10, 15, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .glass-header {
            background: linear-gradient(90deg, rgba(0,200,255,0.2) 0%, rgba(0,0,0,0) 100%);
            border-left: 4px solid #00c8ff;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 200, 255, 0.5); }
        
        /* Missile Item Hover */
        .missile-item {
            transition: all 0.2s ease-out;
            border-left: 2px solid transparent;
        }
        .missile-item:hover {
            background: rgba(0, 255, 255, 0.1);
            border-left: 2px solid #00c8ff;
            padding-left: 0.75rem;
        }
        .missile-item.active {
            background: rgba(0, 200, 255, 0.2);
            border-left: 4px solid #00c8ff;
            padding-left: 0.75rem;
        }
        
        /* Launch Button */
        .btn-launch {
            background: linear-gradient(45deg, #cc0000, #ff3333);
            border: 1px solid #ff6666;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transition: all 0.2s;
        }
        .btn-launch:hover {
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
            transform: scale(1.02);
        }
        .btn-launch:active { transform: scale(0.98); }
        
        /* CG Overlay */
        #cg-overlay { z-index: 1000; }
        
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
        }
        
        /* Leaflet Overrides */
        .leaflet-container .leaflet-control-attribution {
            background: rgba(0,0,0,0.5);
            color: #888;
        }
    </style>
</head>
<body class="text-gray-200 text-sm">

    <!-- Leaflet Map Container -->
    <div id="map"></div>

    <!-- UI Overlay Layer -->
    <div class="absolute inset-0 pointer-events-none z-10 flex justify-between p-4 gap-4">
        
        <!-- Left Sidebar: Missile List -->
        <div class="glass-panel w-full max-w-[300px] h-full rounded-lg flex flex-col pointer-events-auto overflow-hidden">
            <div class="glass-header p-4 shrink-0">
                <h1 class="text-xl font-black tracking-wider text-cyan-400">台灣飛彈戰術模擬器</h1>
                <p class="text-xs text-cyan-600 font-tech mt-1">TAIWAN MISSILE TACTICAL SIM</p>
            </div>
            
            <div class="flex-1 overflow-y-auto p-2" id="missile-list">
                <!-- Injected via JS -->
            </div>
        </div>
        
        <!-- Right Sidebar: Details Panel -->
        <div class="glass-panel w-full max-w-[320px] h-fit rounded-lg flex flex-col pointer-events-auto self-start transition-opacity duration-300" id="details-panel" style="opacity: 0;">
            <div class="p-4 border-b border-cyan-900/50">
                <div class="flex justify-between items-start mb-2">
                    <span id="det-type" class="px-2 py-1 text-[10px] font-bold bg-cyan-900/50 text-cyan-300 rounded border border-cyan-700/50"></span>
                    <span id="det-anim" class="text-xs text-gray-400 font-tech"></span>
                </div>
                <h2 id="det-name" class="text-2xl font-bold text-white tracking-wide"></h2>
            </div>
            
            <div class="p-4 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-black/40 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-500 uppercase">射程 Range</div>
                        <div id="det-range" class="text-lg font-tech text-cyan-400"></div>
                    </div>
                    <div class="bg-black/40 p-2 rounded border border-gray-800">
                        <div class="text-[10px] text-gray-500 uppercase">速度 Speed</div>
                        <div id="det-speed" class="text-lg font-tech text-amber-400"></div>
                    </div>
                </div>
                
                <div>
                    <div class="text-xs text-cyan-500 mb-1 font-bold">戰術描述 TACTICAL DESC.</div>
                    <p id="det-desc" class="text-sm leading-relaxed text-gray-300"></p>
                </div>
            </div>
            
            <div class="p-4 pt-0 mt-auto">
                <button id="btn-launch" class="btn-launch w-full py-3 rounded text-white font-bold tracking-widest flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    發射飛彈 (LAUNCH)
                </button>
            </div>
        </div>
    </div>

    <!-- CG Animation Overlay -->
    <div id="cg-overlay" class="fixed inset-0 bg-black hidden flex-col items-center justify-center">
        <canvas id="cg-canvas" class="absolute inset-0 w-full h-full"></canvas>
        <div class="scanlines absolute inset-0"></div>
        
        <!-- HUD Elements inside CG -->
        <div class="absolute top-8 left-8 pointer-events-none">
            <h3 class="text-red-500 font-tech text-xl animate-pulse">WARNING: WARHEAD DETONATION</h3>
            <div id="cg-target-name" class="text-white text-3xl font-bold mt-1 shadow-black drop-shadow-md"></div>
        </div>
        
        <button id="btn-close-cg" class="absolute bottom-12 px-8 py-3 bg-cyan-900/80 hover:bg-cyan-700 text-cyan-100 border border-cyan-400 rounded tracking-widest font-bold hidden shadow-[0_0_15px_rgba(0,255,255,0.4)] transition cursor-pointer pointer-events-auto">
            CLOSE / 戰果結算
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Data Definitions
        const missiles = [
            { id: 1, name: "天弓三型", type: "防空/反彈道", range: 200, lat: 23.98, lng: 121.60, color: "#3498db", speed: "7馬赫", desc: "高機動垂直發射，高空攔截。", anim: "動能撞擊" },
            { id: 2, name: "天弓四型/強弓", type: "防空/反彈道", range: 300, lat: 24.70, lng: 121.75, color: "#2980b9", speed: "極音速", desc: "攔截高度達大氣層邊緣(100km)。", anim: "動能撞擊" },
            { id: 3, name: "愛國者三型 MSE", type: "防空/反彈道", range: 150, lat: 25.04, lng: 121.56, color: "#2ecc71", speed: "極音速", desc: "動能直接撞擊(Hit-to-Kill)，防護政經中樞。", anim: "動能撞擊" },
            { id: 4, name: "陸劍二型 (TC-2N)", type: "野戰防空", range: 30, lat: 24.95, lng: 121.23, color: "#1abc9c", speed: "超音速", desc: "搭配蜂眼雷達，360度全方位攔截。", anim: "大震波" },
            { id: 5, name: "雄風二型 (HF-2)", type: "重層制海", range: 150, lat: 25.13, lng: 121.74, color: "#e67e22", speed: "0.85馬赫", desc: "雙模抗干擾，可設定轉折點發動奇襲。", anim: "穿甲火柱" },
            { id: 6, name: "雄風三型 (HF-3)", type: "重層制海", range: 150, lat: 24.59, lng: 121.85, color: "#e74c3c", speed: "3馬赫", desc: "超音速掠海飛行，敵艦反應時間不到30秒。", anim: "穿甲火柱" },
            { id: 7, name: "雄三增程型", type: "重層制海", range: 400, lat: 23.57, lng: 119.58, color: "#c0392b", speed: "3馬赫", desc: "射程涵蓋台灣海峽全境與南北航道。", anim: "穿甲火柱" },
            { id: 8, name: "萬劍遙攻飛彈", type: "源頭反制", range: 300, lat: 22.95, lng: 120.20, color: "#9b59b6", speed: "次音速", desc: "拋灑上百枚子母彈，大面積癱瘓敵方機場跑道。", anim: "子母彈" },
            { id: 9, name: "雄昇巡弋飛彈", type: "源頭反制", range: 1000, lat: 22.10, lng: 120.88, color: "#f1c40f", speed: "次音速", desc: "低空貼地巡航，打擊內陸指管中心與基地。", anim: "大震波" },
            { id: 10, name: "擎天極音速飛彈", type: "源頭反制", range: 1500, lat: 22.75, lng: 121.14, color: "#f39c12", speed: "3馬赫以上", desc: "衝壓引擎高空極速突防，建立不對稱戰略嚇阻。", anim: "大震波" }
        ];

        let selectedMissile = null;
        let mapLayerGroup;

        // 2. Initialize Leaflet Map
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([23.7, 121.0], 7);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16,
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
        }).addTo(map);

        mapLayerGroup = L.layerGroup().addTo(map);

        // 3. UI Logic
        const listContainer = document.getElementById('missile-list');
        const detailsPanel = document.getElementById('details-panel');
        
        function renderList() {
            let html = '';
            let currentType = '';
            
            missiles.forEach(m => {
                if (m.type !== currentType) {
                    html += `<div class="text-[10px] text-cyan-600 font-bold mt-3 mb-1 px-2 uppercase tracking-widest">${m.type}</div>`;
                    currentType = m.type;
                }
                html += `
                    <div class="missile-item p-2 mb-1 rounded cursor-pointer flex items-center gap-3" data-id="${m.id}" onclick="selectMissile(${m.id})">
                        <div class="w-3 h-3 rounded-full shadow-[0_0_5px_currentColor]" style="background-color: ${m.color}; color: ${m.color}"></div>
                        <div class="flex-1">
                            <div class="font-bold text-gray-200">${m.name}</div>
                            <div class="text-xs text-gray-500 font-tech">${m.range}km</div>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function selectMissile(id) {
            selectedMissile = missiles.find(m => m.id === id);
            if(!selectedMissile) return;

            // Update List UI
            document.querySelectorAll('.missile-item').forEach(el => {
                el.classList.remove('active');
                if(parseInt(el.dataset.id) === id) el.classList.add('active');
            });

            // Update Map
            mapLayerGroup.clearLayers();
            
            const markerHtml = `
                <div style="background-color: ${selectedMissile.color}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px ${selectedMissile.color};"></div>
            `;
            const customIcon = L.divIcon({
                html: markerHtml,
                className: '',
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });

            // 加入中心點 Marker
            L.marker([selectedMissile.lat, selectedMissile.lng], {icon: customIcon}).addTo(mapLayerGroup);
            
            // 【修正點】：加入 radius 參數 (公尺 = 公里 * 1000) 顯示射程圈
            const circle = L.circle([selectedMissile.lat, selectedMissile.lng], {
                radius: selectedMissile.range * 1000, 
                color: selectedMissile.color,
                fillColor: selectedMissile.color,
                fillOpacity: 0.15,
                weight: 2,
                dashArray: '5, 10'
            }).addTo(mapLayerGroup);

            // 確保地圖視角能容納整個射程圈
            map.flyToBounds(circle.getBounds(), { padding: [50, 50], duration: 1.5 });

            // Update Details Panel
            document.getElementById('det-name').textContent = selectedMissile.name;
            document.getElementById('det-type').textContent = selectedMissile.type;
            document.getElementById('det-anim').textContent = selectedMissile.anim;
            document.getElementById('det-range').textContent = `${selectedMissile.range} km`;
            document.getElementById('det-speed').textContent = selectedMissile.speed;
            document.getElementById('det-desc').textContent = selectedMissile.desc;
            
            document.getElementById('det-type').style.color = selectedMissile.color;
            document.getElementById('det-type').style.borderColor = selectedMissile.color;
            
            detailsPanel.style.opacity = 1;
        }

        renderList();

        // 4. CG Animation Engine (大幅強化版)
        const btnLaunch = document.getElementById('btn-launch');
        const cgOverlay = document.getElementById('cg-overlay');
        const btnCloseCg = document.getElementById('btn-close-cg');
        const canvas = document.getElementById('cg-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let animFrame;
        let particles = [];
        let animationTime = 0;
        let lastTime = 0;
        let animType = "";

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, vx, vy, color, life, size) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.color = color; this.life = life; this.maxLife = life; this.size = size;
            }
            update(dt) {
                this.x += this.vx * dt * 60;
                this.y += this.vy * dt * 60;
                this.life -= dt;
            }
            draw(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        btnLaunch.addEventListener('click', () => {
            if(!selectedMissile) return;
            document.getElementById('cg-target-name').textContent = selectedMissile.name;
            cgOverlay.classList.remove('hidden');
            cgOverlay.classList.add('flex');
            btnCloseCg.classList.add('hidden');
            
            animType = selectedMissile.anim;
            particles = [];
            animationTime = 0;
            lastTime = performance.now();
            
            setTimeout(() => {
                btnCloseCg.classList.remove('hidden');
            }, 3000);

            requestAnimationFrame(animate);
        });

        btnCloseCg.addEventListener('click', () => {
            cgOverlay.classList.add('hidden');
            cgOverlay.classList.remove('flex');
            cancelAnimationFrame(animFrame);
        });

        function animate(now) {
            // 防護機制，避免切換分頁導致 dt 過大
            let dt = (now - lastTime) / 1000;
            if(dt > 0.1) dt = 0.1; 
            lastTime = now;
            animationTime += dt;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // --- 特效 1：動能撞擊 (愛國者/天弓) ---
            if (animType === "動能撞擊") {
                if (animationTime < 0.5) {
                    const progress = animationTime * 2; 
                    const targetX = cx; const targetY = cy - 300 + 300*progress;
                    const interX = cx - 400 + 400*progress; const interY = cy + 300 - 300*progress;
                    
                    // 繪製彈道
                    ctx.globalAlpha = 1;
                    ctx.strokeStyle = '#ff3333'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx, cy-300); ctx.lineTo(targetX, targetY); ctx.stroke();
                    ctx.strokeStyle = '#33ccff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx-400, cy+300); ctx.lineTo(interX, interY); ctx.stroke();
                    
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(targetX, targetY, 5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(interX, interY, 5, 0, Math.PI*2); ctx.fill();
                } else if (animationTime > 0.5 && animationTime < 0.55 && particles.length === 0) {
                    // 瞬間高能爆炸
                    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
                    for (let i=0; i<400; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 35 + 10;
                        particles.push(new Particle(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, Math.random()>0.5?'#00ffff':'#ffffff', Math.random()*1.5+0.5, Math.random()*3+1));
                    }
                }
            } 
            // --- 特效 2：穿甲火柱 (雄風系列) ---
            else if (animType === "穿甲火柱") {
                if (animationTime < 0.2) {
                    ctx.fillStyle = `rgba(255, 50, 0, ${1 - animationTime*5})`;
                    ctx.fillRect(0,0,canvas.width,canvas.height);
                }
                if (animationTime > 0.1 && animationTime < 1.0) {
                    const alpha = Math.max(0, 1 - (animationTime - 0.1));
                    const width = 80 + Math.random()*30;
                    ctx.fillStyle = `rgba(255, 100, 0, ${alpha * 0.9})`;
                    ctx.fillRect(cx - width/2, 0, width, cy + 150);
                    ctx.fillStyle = `rgba(255, 255, 200, ${alpha})`;
                    ctx.fillRect(cx - width/4, 0, width/2, cy + 150);
                }
                if (animationTime > 0.1 && particles.length < 350) {
                    for(let i=0; i<20; i++){
                        particles.push(new Particle(cx + (Math.random()-0.5)*120, cy + 150, (Math.random()-0.5)*15, -(Math.random()*25 + 10), ['#ff3300', '#ff9900', '#ffff66'][Math.floor(Math.random()*3)], Math.random()*1.5+0.5, Math.random()*6+2));
                    }
                }
                particles.forEach(p => p.vy += 10 * dt); // 火花重力墜落
            }
            // --- 特效 3：子母彈 (萬劍) ---
            else if (animType === "子母彈") {
                if (animationTime < 3.0) {
                    if (Math.random() < 0.4) { // 高頻率多點爆炸
                        const px = cx + (Math.random()-0.5)*1000;
                        const py = cy + (Math.random()-0.5)*600;
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath(); ctx.arc(px, py, 25, 0, Math.PI*2); ctx.fill();
                        
                        for(let i=0; i<30; i++){
                            const angle = Math.random() * Math.PI * 2;
                            const speed = Math.random() * 8 + 2;
                            particles.push(new Particle(px, py, Math.cos(angle)*speed, Math.sin(angle)*speed, ['#9b59b6', '#e74c3c', '#f1c40f'][Math.floor(Math.random()*3)], Math.random()*1+0.2, Math.random()*4+1));
                        }
                    }
                }
            }
            // --- 特效 4：大震波 (擎天/雄昇/陸劍) ---
            else if (animType === "大震波") {
                if (animationTime < 0.1) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0,0,canvas.width,canvas.height);
                } else {
                    const radius1 = (animationTime - 0.1) * 2200;
                    const radius2 = (animationTime - 0.1) * 1400;
                    
                    if(radius1 < canvas.width * 1.5) {
                        ctx.globalAlpha = Math.max(0, 1 - (animationTime-0.1)/1.5);
                        ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 35;
                        ctx.beginPath(); ctx.arc(cx, cy, radius1, 0, Math.PI*2); ctx.stroke();
                        
                        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 15;
                        ctx.beginPath(); ctx.arc(cx, cy, radius2, 0, Math.PI*2); ctx.stroke();
                    }
                    if (animationTime < 0.8 && particles.length < 400) {
                        for(let i=0; i<30; i++){
                            const angle = Math.random() * Math.PI * 2;
                            const speed = Math.random() * 25 + 5;
                            particles.push(new Particle(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, ['#7f8c8d', '#34495e', '#e67e22'][Math.floor(Math.random()*3)], Math.random()*2+1, Math.random()*15+5));
                        }
                    }
                }
                // 模擬濃煙摩擦力與緩慢升騰
                particles.forEach(p => { p.vx *= 0.96; p.vy -= 3 * dt; }); 
            }

            // 更新並繪製所有粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            ctx.globalCompositeOperation = 'source-over';
            animFrame = requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
